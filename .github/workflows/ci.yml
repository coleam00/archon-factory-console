# CI for the factory-console proof of concept. Upstream Archon's full CI (release, docs, e2e,
# Postgres) is not run here; this covers what the console work can break.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  BUN_VERSION: "1.4.2"
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Generated API types, lint, format
        run: bun run validate --only generated-files,lint,format
      # A private repository's runner has 7 GB; `bun run type-check` checks every package at
      # once and runs out of memory there, so the packages are checked one after another.
      - name: Type-check, one package at a time
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          for p in packages/*/; do
            if grep -q '"type-check"' "$p/package.json" 2>/dev/null; then
              printf '== %s\n' "$p"
              bun run --cwd "$p" type-check || exit 1
            fi
          done
          bun x tsc --noEmit -p scripts/tsconfig.json
          bun x tsc --noEmit -p .archon/scripts/tsconfig.json
          bun x tsc --noEmit -p .archon/workflows/tsconfig.json
      - name: Web tests
        run: bun run --cwd packages/web test
      - name: Server tests
        run: bun run --cwd packages/server test
      # The factory overview's line rules exist twice (the schema in packages/workflows, the web
      # layout); this seeded test keeps the two copies giving the same verdict.
      - name: Factory overview geometry parity
        run: bun test ./scripts/overview-geometry-parity.test.ts
      # The factory view's schema and coverage check. The coverage test shares the step-stage
      # fixture with the web placement test, which keeps their two placement rules in agreement.
      - name: Factory view schema and coverage
        run: bun test src/schemas/factory-view src/factory-view-coverage.test.ts
        working-directory: packages/workflows
      - name: Web build
        run: bun run build:web

  # The factory console's reads must work on Postgres as well as SQLite. Each test creates and
  # drops its own scratch database; each file replaces the connection module, so each runs in
  # its own process (as upstream's postgres job does).
  postgres:
    name: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Factory reads on Postgres
        env:
          ARCHON_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          shopt -s nullglob
          for f in packages/core/src/db/factory-*.postgres.integration.test.ts packages/workflows/src/factory-*.postgres.integration.test.ts; do
            printf '== %s\n' "$f"
            bun test "$f" || exit 1
          done
